services:
  trust-chat:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - .local/chat.env
    environment:
      LOCAL_MODEL_URL: http://host.docker.internal:1234/v1/chat/completions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
